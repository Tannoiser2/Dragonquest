name: Test regole

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Importa il progetto
        run: ./godot --headless --path . --import 2>&1 | tail -20 || true
      - name: Test headless (esempi del manuale + 30 partite IA)
        run: |
          ./godot --headless --path . res://tests/Test.tscn 2>&1 | tee test.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERRORE" test.log; then exit 1; fi
          grep -q "ERRORI: 0" test.log
      - name: Controllo glifi
        run: |
          pip install -q fonttools
          python3 tools/controlla_glifi.py
      - name: Screenshot dell'interfaccia (stampati in base64 nel registro)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          mkdir -p shot
          xvfb-run -a -s "-screen 0 1600x900x24" ./godot --path . --rendering-driver opengl3 --resolution 1600x900 res://tests/Screenshot.tscn -- "$PWD/shot" 2>&1 | tail -20 || true
          for f in shot/*.png; do echo "===INIZIO $(basename $f)==="; base64 -w 0 "$f"; echo; echo "===FINE==="; done
