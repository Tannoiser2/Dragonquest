# Costruisce la versione web del gioco con Godot e la pubblica su GitHub Pages (e, se ci sono i segreti,
# sulla ludoteca privata di Cloudflare).
# Non parte a ogni modifica: si avvia a mano (Actions → Pubblica → Run workflow)
# oppure con un commit che nel messaggio contiene [pubblica].
name: Pubblica

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pubblica]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica Godot 4.7.2 e il modello di esportazione web
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/4.7.2.stable
          mkdir -p $T
          unzip -q -j Godot_v4.7.2-stable_export_templates.tpz templates/web_nothreads_release.zip -d $T
          cp $T/web_nothreads_release.zip $T/web_nothreads_debug.zip

      - name: Esporta la versione web
        run: |
          mkdir -p build/web
          ./godot --headless --path . --import || true
          ./godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.pck
          touch build/web/.nojekyll

      - name: Screenshot dell'interfaccia
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          mkdir -p build/web/screenshot
          xvfb-run -a -s "-screen 0 1600x900x24" ./godot --path . --rendering-driver opengl3 --resolution 1600x900 res://tests/Screenshot.tscn -- "$PWD/build/web/screenshot" 2>&1 | tail -20 || true
          ls build/web/screenshot

      # Ludoteca privata: con i segreti CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID pubblica il gioco su
      # https://dragonquest.<dominio>/ protetto da email e codice. Senza segreti non fa nulla.
      - name: Pubblica su Cloudflare (ludoteca privata)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LUDOTECA_DOMINIO: ludoteca-digitale.com
        run: python3 tools/pubblica_cloudflare.py build/web dragonquest dragonquest

      # GitHub Pages solo finché il repository è pubblico
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with:
          path: build/web

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
